ShortDescription: Claude Code profile switcher - one login per profile, picked at launch
Description: |-
  tabard launches Claude Code with CLAUDE_CONFIG_DIR pointed at a per-profile directory, so
  each profile keeps its own login, settings, project config and history. Credentials are
  never copied in and out of ~/.claude, so token rotation cannot strand a saved profile and
  two terminals can run two profiles at once. A profile can hold an Anthropic login or
  OpenRouter settings written into its own settings.json.
