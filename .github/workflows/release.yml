name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true

jobs:
  ## A tag push carries the version; a manual run is told it. Everything downstream reads it here.
  version:
    runs-on: ubuntu-latest
    name: Resolve Version
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    permissions: {} # reads the ref name, touches nothing
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            *-*) prerelease=true ;;   # 1.0.0-rc.1 and friends
            *)   prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease=$prerelease)"

  ## Nothing ships unless the suite is green on every platform
  test:
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Enable Automated Test Report Artifact Upload
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);
      - run: |
          dotnet test --verbosity normal

  ## Portable IL package for `dotnet tool install -g Wivuu.Tabard`
  pack:
    runs-on: ubuntu-latest
    name: Pack Tool Package
    needs: [version, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet pack src/Wivuu.Tabard.CLI -c Release -p:Version=${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  ## Native AOT binaries, one per RID. AOT links with the host toolchain, so each RID
  ## builds on a runner that can produce it rather than cross-compiling.
  binaries:
    runs-on: ${{ matrix.os }}
    name: Publish ${{ matrix.rid }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: win-x64, os: windows-latest }
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install AOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Publish
        run: >
          dotnet publish src/Wivuu.Tabard.CLI -c Release -r ${{ matrix.rid }}
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/${{ matrix.rid }}
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf "tabard-$VERSION-${{ matrix.rid }}.tar.gz" -C "publish/${{ matrix.rid }}" tabard
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/tabard.exe" -DestinationPath "tabard-$env:VERSION-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.rid }}
          path: |
            tabard-*.tar.gz
            tabard-*.zip
          if-no-files-found: error

  ## Attach everything to a GitHub release
  release:
    runs-on: ubuntu-latest
    name: Publish GitHub Release
    needs: [version, pack, binaries]
    permissions:
      contents: write # gh release create
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{binary-*,nupkg}"
          merge-multiple: true
      - name: Checksum
        run: |
          cd dist
          ## Binaries are tabard-<version>-<rid>.*, the package is Wivuu.Tabard.<version>.nupkg.
          ## Both are listed explicitly so a rename can't silently drop one from the manifest.
          sha256sum tabard-* Wivuu.Tabard.*.nupkg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        run: |
          flags=(--title "tabard v$VERSION" --generate-notes)
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/* "${flags[@]}"

  ## Push to nuget.org via trusted publishing. No long-lived key: the job trades a GitHub
  ## OIDC token for an API key that nuget.org only honours for an hour, so the login step
  ## has to sit immediately before the push.
  ##
  ## The matching policy on nuget.org is keyed on owner `wivuu`, repo `wivuu.tabard` and
  ## workflow file `release.yml` - renaming this file breaks publishing until the policy
  ## is updated to match.
  nuget:
    runs-on: ubuntu-latest
    name: Push to NuGet
    needs: [version, pack, release]
    permissions:
      id-token: write # let this job mint an OIDC token for nuget.org
      contents: read
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }} # nuget.org profile name, not an email address
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  ## The Homebrew formula points at assets the release job has already published, so this runs
  ## after it and commits the bumped formula back to master. Prereleases are skipped on purpose -
  ## brew users should only ever be offered a stable version.
  packaging:
    runs-on: ubuntu-latest
    name: Update Formula
    needs: [version, release]
    if: needs.version.outputs.prerelease == 'false'
    permissions:
      contents: write # commits the bumped formula back to master
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      ## The tag ref is detached; the bump has to land on the branch, not on the tag.
      - uses: actions/checkout@v6
        with:
          ref: master

      ## Reuse the manifest the release job signed off on rather than re-hashing downloads.
      - name: Fetch checksums
        run: gh release download "v$VERSION" --pattern SHA256SUMS.txt --output sums.txt

      - name: Bump Homebrew formula
        run: |
          old=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/tabard.rb)
          ## Version appears in the version line and inside every download URL.
          sed -i "s/${old//./\\.}/$VERSION/g" Formula/tabard.rb

          ## Each sha256 line is tagged with its RID so the right hash lands on the right line,
          ## and every one is read back: a stale hash would serve the previous release under
          ## the new version number.
          for rid in osx-arm64 osx-x64 linux-arm64 linux-x64; do
            sum=$(awk -v f="tabard-$VERSION-$rid.tar.gz" '$2 == f { print $1 }' sums.txt)
            [ -n "$sum" ] || { echo "::error::no checksum for $rid in SHA256SUMS.txt"; exit 1; }
            sed -i -E "s|^([[:space:]]*sha256 \")[0-9a-f]{64}(\" # $rid\$)|\1$sum\2|" Formula/tabard.rb
            grep -q "sha256 \"$sum\" # $rid\$" Formula/tabard.rb ||
              { echo "::error::formula sha256 for $rid did not update"; exit 1; }
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          ## A re-run of an already-packaged version has nothing to commit, which is fine.
          if git diff --cached --quiet; then
            echo "formula already at $VERSION"
          else
            git commit -m "chore: point homebrew formula at v$VERSION"
            git push origin HEAD:master
          fi
