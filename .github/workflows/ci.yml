name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ## Run .NET unit tests
  test:
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The link/adoption tests drive the real filesystem, and symlink behaviour is the
        # thing most likely to differ per platform, so all three are worth running.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Enable Automated Test Report Artifact Upload
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);
      - run: |
          dotnet test --verbosity normal

  ## Check formatting with csharpier
  format:
    runs-on: ubuntu-latest
    name: Check Formatting
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: dotnet csharpier check .

  ## Prove the tool package still builds
  pack:
    runs-on: ubuntu-latest
    name: Pack Tool Package
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet pack src/Tabard.CLI -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
